{% extends 'solar_system/base.html' %}

{% block title %}Sign up | Study Hub{% endblock %}

{% block head %}
  <style>
    .auth-card { max-width: 560px; margin: 3rem auto; padding: clamp(1.25rem, 4vw, 2rem); border: 1px solid #2a3b56; border-radius: 20px; background: #101827; }
    .auth-card h1 { margin: .5rem 0 1rem; }
    .auth-card form p { display: grid; gap: .45rem; margin: 1rem 0; }
    .auth-card input { width: 100%; min-height: 44px; padding: .65rem .75rem; border: 1px solid #405574; border-radius: 9px; background: #080d18; color: #eef3ff; font: inherit; }
    .auth-card .helptext { color: #aab9d0; font-size: .85rem; }
    .auth-card ul { padding-left: 1.25rem; color: #f2a9a9; }
    .auth-card .button { cursor: pointer; font: inherit; }
  </style>
{% endblock %}

{% block content %}
<main class="auth-card">
  <div class="eyebrow">Join Study Hub</div>
  <h1>Create your student account</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="button" type="submit">Sign up</button>
  </form>
  <p>Already have an account? <a href="{% url 'solar_system:login' %}">Log in</a>.</p>
</main>
{% endblock %}
